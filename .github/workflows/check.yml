# 推送时只做校验（类型检查 + 单测 + 构建 + 产物检查），不部署 —— 上线前再加部署那一步。
# 用 GitHub 托管的 runner：公开仓不计分钟数。别换成自建 runner —— 公开仓挂自建 runner，外部代码可能在那台机器上执行。
name: check
on:
  push:
  workflow_dispatch:
# 同一分支有新推送时，取消还在跑的旧那次
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run verify
