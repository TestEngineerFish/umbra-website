# 推送时只做校验（类型检查 + 单测 + 构建 + 产物检查），不部署 —— 上线前再加部署那一步。
# 跑在 sam 那台 Mac 上的自建 runner（10-23 定：GitHub 免费分钟数用完了），标签 umbra-mac。
# 仓库是公开的：只在 push / 手动触发时跑，不加 pull_request，免得外部 fork 的 PR 在这台机器上执行代码。
name: check
on:
  push:
  workflow_dispatch:
# 同一分支有新推送时，取消还在跑的旧那次
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: [self-hosted, umbra-mac]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run verify
