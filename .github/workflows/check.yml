# 推送时只做校验（类型检查 + 单测 + 构建 + 产物检查），不部署 —— 上线前再加部署那一步。
name: check
on:
  push:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run verify
